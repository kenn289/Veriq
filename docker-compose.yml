services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: veriq
      POSTGRES_PASSWORD: veriq
      POSTGRES_DB: veriq
    ports:
      - "5432:5432"
    volumes:
      - veriq_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:RELEASE.2024-10-29T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: veriq
      MINIO_ROOT_PASSWORD: veriqsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - veriq_minio:/data

volumes:
  veriq_postgres:
  veriq_minio:
