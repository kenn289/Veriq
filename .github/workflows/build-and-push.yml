name: Build, Test, and Push Docker images

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

env:
  WEB_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/veriq-web
  FRONTEND_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/veriq-frontend
  WORKER_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/veriq-worker
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build images (load into runner)
    runs-on: ubuntu-latest
    outputs:
      web_image: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
      worker_image: ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image and load
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Capture web image id
        run: |
          id=$(docker image inspect --format='{{.Id}}' ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }})
          echo $id > web_image_id.txt
          echo "web_image_id=$id" >> $GITHUB_OUTPUT

      - name: Upload web image id artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-image-id
          path: web_image_id.txt

      - name: Build frontend image and load
        uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./docker/frontend.Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Capture frontend image id
        run: |
          id=$(docker image inspect --format='{{.Id}}' ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }})
          echo $id > frontend_image_id.txt
          echo "frontend_image_id=$id" >> $GITHUB_OUTPUT

      - name: Upload frontend image id artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-id
          path: frontend_image_id.txt

      - name: Build worker image and load
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.playwright
          push: false
          load: true
          tags: |
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Capture worker image id
        run: |
          id=$(docker image inspect --format='{{.Id}}' ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }})
          echo $id > worker_image_id.txt
          echo "worker_image_id=$id" >> $GITHUB_OUTPUT

      - name: Upload worker image id artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-image-id
          path: worker_image_id.txt

  integration:
    name: Integration tests (smoke + optional pytest)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set env for compose
        run: |
          echo "WEB_IMAGE=${{ env.WEB_IMAGE }}" >> $GITHUB_ENV
          echo "WORKER_IMAGE=${{ env.WORKER_IMAGE }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Install Docker Compose plugin
        uses: docker/setup-buildx-action@v3

      - name: Start services with docker-compose
        run: |
          docker compose -f backend/docker-compose.yml -f backend/docker-compose.override.yml -f backend/docker-compose.ci.yml up -d --wait

      - name: Download built image id artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-image-id

      - name: Download worker image id artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-image-id

      - name: Verify local web image id matches built artifact
        run: |
          expected=$(cat web_image_id.txt)
          actual=$(docker image inspect --format='{{.Id}}' ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }})
          echo "expected=$expected"; echo "actual=$actual"
          if [ "$expected" != "$actual" ]; then echo "Web image id mismatch"; exit 1; fi

      - name: Verify local worker image id matches built artifact
        run: |
          expected=$(cat worker_image_id.txt)
          actual=$(docker image inspect --format='{{.Id}}' ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }})
          echo "expected=$expected"; echo "actual=$actual"
          if [ "$expected" != "$actual" ]; then echo "Worker image id mismatch"; exit 1; fi

      - name: Wait for web health endpoint
        run: |
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health || true)
            echo "health status: $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Run full test suite inside composed environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e backend[dev]
          pytest backend/tests -q

      - name: Tear down compose
        if: always()
        run: |
          docker compose -f backend/docker-compose.yml -f backend/docker-compose.override.yml -f backend/docker-compose.ci.yml down

  push:
    name: Push images to registry
    runs-on: ubuntu-latest
    needs: integration
    if: needs.integration.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push web image (tag)
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push web image as latest (only on main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest

      - name: Push worker image (tag)
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.playwright
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push worker image as latest (only on main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.playwright
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:latest

      - name: Sign web image with cosign (keyless)
        uses: sigstore/cosign-action@v2
        with:
          image: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          keyless: true

      - name: Sign worker image with cosign (keyless)
        uses: sigstore/cosign-action@v2
        with:
          image: ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }}
          keyless: true

      - name: Push frontend image (tag)
        uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push frontend image as latest (only on main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Sign frontend image with cosign (keyless)
        uses: sigstore/cosign-action@v2
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          keyless: true

      - name: Verify frontend image signature with cosign (keyless)
        uses: sigstore/cosign-action@v2
        with:
          action: verify
          image: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          keyless: true

      - name: Verify web image signature with cosign (keyless)
        uses: sigstore/cosign-action@v2
        with:
          action: verify
          image: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          keyless: true

      - name: Verify worker image signature with cosign (keyless)
        uses: sigstore/cosign-action@v2
        with:
          action: verify
          image: ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }}
          keyless: true
      - name: Generate provenance JSON and upload signatures to MinIO/S3 (optional)
        if: ${{ secrets.MINIO_ENDPOINT != '' && secrets.MINIO_ACCESS_KEY != '' && secrets.MINIO_SECRET_KEY != '' && secrets.MINIO_BUCKET != '' }}
        run: |
          set -euo pipefail
          echo "Installing mc, jq and cosign prerequisites"
          sudo apt-get update && sudo apt-get install -y curl jq
          COSIGN_VERSION=$(curl -s https://api.github.com/repos/sigstore/cosign/releases/latest | jq -r .tag_name)
          curl -fsSL -o cosign https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign

          echo "Verifying and extracting signatures"
          cosign verify --output-signature web.sig ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }} || true
          cosign verify --output-signature worker.sig ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }} || true

          echo "Collecting image metadata"
          web_id=$(docker image inspect --format='{{.Id}}' ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }})
          worker_id=$(docker image inspect --format='{{.Id}}' ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }})
          git_sha=$(git rev-parse --short HEAD || echo "")
          timestamp=$(date --iso-8601=seconds)

          echo "Creating provenance JSON"
          jq -n --arg web_image "${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}" \
                --arg worker_image "${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }}" \
                --arg web_id "$web_id" \
                --arg worker_id "$worker_id" \
                --arg git_sha "$git_sha" \
                --arg ts "$timestamp" \
                '{web_image: $web_image, worker_image: $worker_image, web_image_id: $web_id, worker_image_id: $worker_id, git_sha: $git_sha, timestamp: $ts}' > provenance.json

          echo "Configuring mc"
          curl -fsSL -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          sudo chmod +x /usr/local/bin/mc
          if [ -n "${MINIO_ENDPOINT:-}" ] && [ -n "${MINIO_ACCESS_KEY:-}" ] && [ -n "${MINIO_SECRET_KEY:-}" ] && [ -n "${MINIO_BUCKET:-}" ]; then
            mc alias set myminio ${MINIO_ENDPOINT} ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} --api S3v4
            mc mb --ignore-existing myminio/${MINIO_BUCKET}
            echo "Uploading signatures and provenance to MinIO"
            mc cp web.sig myminio/${MINIO_BUCKET}/signatures/${{ env.IMAGE_TAG }}/web.sig || true
            mc cp worker.sig myminio/${MINIO_BUCKET}/signatures/${{ env.IMAGE_TAG }}/worker.sig || true
            mc cp provenance.json myminio/${MINIO_BUCKET}/signatures/${{ env.IMAGE_TAG }}/provenance.json
          elif [ -n "${AWS_S3_BUCKET:-}" ] && [ -n "${AWS_DEFAULT_REGION:-}" ]; then
            echo "Uploading signatures and provenance to S3"
            aws s3 cp web.sig s3://${AWS_S3_BUCKET}/signatures/${{ env.IMAGE_TAG }}/web.sig || true
            aws s3 cp worker.sig s3://${AWS_S3_BUCKET}/signatures/${{ env.IMAGE_TAG }}/worker.sig || true
            aws s3 cp provenance.json s3://${AWS_S3_BUCKET}/signatures/${{ env.IMAGE_TAG }}/provenance.json || true
            # verify uploaded objects
            aws s3api head-object --bucket ${AWS_S3_BUCKET} --key signatures/${{ env.IMAGE_TAG }}/provenance.json
          else
            echo "No MINIO or AWS S3 credentials provided; skipping upload"
          fi
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Configure AWS credentials for S3 (if provided)
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
