name: Create Issues from User Stories

on:
  workflow_dispatch:
    inputs:
      create_remote:
        description: 'Create issues on GitHub (requires repo token with issues permission)'
        required: true
        default: 'false'

jobs:
  generate-and-create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate local issue files
        run: |
          python scripts/generate_issues_from_stories.py

      - name: Create GitHub issues (optional)
        if: ${{ github.event.inputs.create_remote == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/generate_issues_from_stories.py --create-remote --repo $GITHUB_REPOSITORY
