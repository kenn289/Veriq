[project]
name = "veriq-backend"
version = "0.1.0"
description = "Veriq backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0,<5",
  "python-jose[cryptography]>=3.3",
  "email-validator>=2.1",
  "redis>=5.0",
  "celery>=5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "coverage>=7.4",
  "mypy>=1.8",
  "ruff>=0.4",
  "black>=24.4",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veriq*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["alembic"]

[tool.pytest.ini_options]
addopts = "-q --cov=veriq --cov-report=term-missing --cov-fail-under=78"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["veriq"]

[tool.coverage.report]
show_missing = true
