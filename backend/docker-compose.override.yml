version: '3.8'
services:
  web:
    environment:
      VERIQ_CELERY_ENABLED: "false"
      VERIQ_EXECUTION_BACKEND: "local"
    volumes:
      - .:/app:rw
    command: uvicorn veriq.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    environment:
      VERIQ_CELERY_ENABLED: "true"
      VERIQ_EXECUTION_BACKEND: "local"
    image: veriq-worker:latest
    # In dev you may want to mount the code; uncomment to enable live reload
    # volumes:
    #  - .:/app:rw
    command: celery -A veriq.celery_app.celery_app worker --loglevel=info -Q default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "celery"]
      interval: 30s
      timeout: 5s
      retries: 3
